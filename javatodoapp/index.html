<!DOCTYPE html>
<!-- DOCTYPE: Standard HTML5 declaration telling the browser how to render the document -->
<html lang="en">
<head>
  <!-- Character Encoding & Title: UTF-8 ensures broad character support; title sets the tab text -->
  <meta charset="UTF-8">
  <title>Todo App</title>

  <!-- External Stylesheet: Separation of Concerns — CSS handles presentation, HTML handles structure -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Main Landmark Heading: Semantic HTML — H1 provides top-level accessibility structure -->
  <h1>My Todo App</h1>

  <!-- 
    LESSON 1: DOM Alignment & ID Matching
    JavaScript relies on exact string matches via document.getElementById().
    Ensure container IDs match script targets (e.g., #user-bar, #user-email).
  -->
  <div id="user-bar" class="hidden">
    Logged in as: <strong id="user-email"></strong>
    <!-- Interactive Element: Native <button> handles keyboard focus and click events out of the box -->
    <button id="logout-btn">Logout</button>
  </div>

  <!-- 
    LESSON 2: Dynamic State Containers
    Instead of duplicate forms for Login/Register, a single unified form container 
    allows JavaScript to toggle mode, title, and endpoint dynamically.
  -->
  <div id="auth-section">
    <h2 id="auth-title">Login</h2>
    
    <!-- 
      LESSON 3: HTML Form Semantics
      Wrapping inputs in a <form> enables native browser submit behavior 
      (e.g., submitting on 'Enter' key press) handled by JS event.preventDefault().
    -->
    <form id="auth-form">
      <!-- Standardized Inputs: Using matching IDs (#email, #password) expected by app.js -->
      <input type="email" id="email" placeholder="email" required>
      <input type="password" id="password" placeholder="password" required>
      <button type="submit" id="auth-submit">Login</button>
    </form>

    <!-- Mode Toggle: type="button" prevents accidental form submission when clicked -->
    <p>
      <span id="toggle-msg">Don't have an account?</span>
      <button id="toggle-auth-btn" type="button">Register</button>
    </p>
  </div>

  <!-- 
    LESSON 4: CSS Class vs Inline Style Control
    Use class-based visibility (.hidden { display: none; }) rather than inline styles 
    (style="display: none;"). This allows clean JS state management via element.classList.
  -->
  <div id="todo-section" class="hidden">
    <h2>My Todos</h2>

    <!-- Form Handler Binding: Form ID #add-todo-form matches app.js event listener -->
    <form id="add-todo-form">
      <input type="text" id="todo-input" placeholder="new todo..." required>
      <button type="submit">Add</button>
    </form>

    <!-- Dynamic DOM Insertion Target: Unordered list populated dynamically via document.createElement() -->
    <ul id="todo-list"></ul>
  </div>

  <!-- 
    LESSON 5: Non-Blocking Script Loading
    Loading scripts at the bottom of <body> ensures all HTML DOM nodes are parsed 
    before JavaScript runs document.getElementById() calls.
  -->
  <script src="app.js"></script>
</body>
</html>
